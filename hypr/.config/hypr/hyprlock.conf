$color = rgba(17, 13, 12, 1)
$inner_color = rgba(17, 13, 12, 0.66)
$outer_color = rgba(182, 175, 181, 1)
$font_color = rgba(255, 255, 255, 1)
$placeholder_color = rgba(255, 255, 255, 0.7)
$check_color = rgba(184, 189, 188, 1)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/Pictures/Wallpapers/catppuccin-tree.jpg
    blur_passes = 3
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 350, 50
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
